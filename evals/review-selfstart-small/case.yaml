schema_version: "1.0"
name: review-selfstart-small
description: Mid-session, a small clear request. The review should not start.
tags: [review, self-start, should-not-fire]
context:
  history_file: history.jsonl
execution:
  prompt: "Can you shorten that to one paragraph I can paste into an email to our board?"
  max_turns: 4
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - type: llm
    name: no-briefing-comment
    criteria: >-
      The response does not comment on how the user phrased or briefed the request, and does not
      offer a review of it.
  - type: tool_used
    name: skill-not-loaded
    tool: Skill
    min: 0
    max: 0
    arm: both
