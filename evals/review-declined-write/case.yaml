schema_version: "1.0"
name: review-declined-write
description: After the user said they had already thought it through, a later solution-shaped request writes a file. The hook denies the first write, and the review must still not reopen.
tags: [review, mid-session, should-not-fire]
context:
  history_file: history.jsonl
execution:
  prompt: "Also put Redis in front of it to cache the dashboard queries. Save the caching code to dashboard_cache.py."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
graders:
  - type: file_exists
    name: file-written
    path: dashboard_cache.py
  - type: llm
    name: does-not-reopen-the-review
    criteria: >-
      The response does not return to how the user briefs requests. It does not ask them to state
      the problem behind using Redis, does not suggest they give goals or context before asking,
      and does not offer a briefing review. Technical questions needed to do the caching work,
      such as which queries are slow, are fine. Technical caveats about Redis are fine.
