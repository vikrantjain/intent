schema_version: "1.0"
name: review-quiet-write
description: Mid-session, a small clear request that writes a file. The first write is denied once, and the review should still not start.
tags: [review, mid-session, should-not-fire]
context:
  history_file: history.jsonl
execution:
  prompt: "Great, that's clear. Save that explanation to warehouse-vs-lake.md so I can share it with the board."
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
graders:
  - type: file_exists
    name: file-written
    path: warehouse-vs-lake.md
  - type: tool_used
    name: skill-not-loaded
    tool: Skill
    min: 0
    max: 0
    arm: both
  - type: llm
    name: no-briefing-comment
    criteria: >-
      The response does not comment on how the user phrased or briefed the request, and does not
      offer a review of it.
